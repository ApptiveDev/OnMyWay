spring.application.name=onmyway

spring.config.import=optional:file:../.env[.properties]

# ?? ??? ?? (?? ?? ??? dev? ????)
# spring.profiles.active=dev

# Kakao Provider ??
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Kakao Registration
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=https://www.onmyway.cloud/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname, profile_image, account_email
spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# DB ??
spring.datasource.url=${POSTGRESQL_URL}
spring.datasource.username=onmyway_user
spring.datasource.password=${POSTGRESQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.default_schema=public

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${ACCESS_TOKEN_EXPIRATION}
jwt.refresh-expiration=${REFRESH_TOKEN_EXPIRATION}

# Nginx
server.forward-headers-strategy=native

#Tmap api
tmap.api.key=${TMAP_API_KEY}

# Naver api
naver.api.clientId=${NAVER_CLIENT_ID}
naver.api.clientSecret=${NAVER_CLIENT_SECRET}
